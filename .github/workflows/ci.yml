name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust 1.88.0
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - name: Check Rust formatting
        run: cargo +1.88.0 fmt --all -- --check
      - name: Run Rust tests
        run: cargo +1.88.0 test --workspace
      - name: Run Clippy
        run: cargo +1.88.0 clippy --workspace --all-targets -- -D warnings

  web:
    name: Web quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Bun 1.3.14
        run: npm install --global bun@1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint WebUI
        run: bun run lint
      - name: Check Svelte and TypeScript
        run: bun run --cwd apps/web check
      - name: Run WebUI mock tests
        run: bun run test:mock
      - name: Build WebUI
        run: bun run --cwd apps/web build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust 1.88.0
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Install Bun 1.3.14
        run: npm install --global bun@1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install locked Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run browser E2E
        env:
          CI: "true"
        run: bun run test:e2e
